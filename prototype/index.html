    // Shared Category Bar Component
    function CategoryBar({ categories, selectedCategory, onSelectCategory, badgeStyle = 'underline' }) {
      const scrollRef = useRef(null);
      const [canScrollLeft, setCanScrollLeft] = useState(false);
      const [canScrollRight, setCanScrollRight] = useState(true);

      const checkScroll = () => {
        if (!scrollRef.current) return;
        const { scrollLeft, scrollWidth, clientWidth } = scrollRef.current;
        setCanScrollLeft(scrollLeft > 10);
        setCanScrollRight(scrollLeft < scrollWidth - clientWidth - 10);
      };

      useEffect(() => {
        checkScroll();
        const el = scrollRef.current;
        if (el) el.addEventListener('scroll', checkScroll);
        window.addEventListener('resize', checkScroll);
        return () => {
          if (el) el.removeEventListener('scroll', checkScroll);
          window.removeEventListener('resize', checkScroll);
        };
      }, []);

      const scrollBy = (offset) => {
        if (scrollRef.current) {
          scrollRef.current.scrollBy({ left: offset, behavior: 'smooth' });
        }
      };

      return (
        <div className="relative border-b border-hairline-soft bg-canvas px-6 md:px-12 flex items-center h-20 select-none">
          {/* Left Arrow */}
          {canScrollLeft && (
            <div className="absolute left-6 z-10 flex items-center pr-4">
              <div className="gradient-mask-left absolute -left-6 top-0 bottom-0 w-16 pointer-events-none" />
              <button
                onClick={() => scrollBy(-280)}
                aria-label="Previous categories"
                className="relative z-10 flex h-8 w-8 items-center justify-center rounded-full border border-hairline bg-canvas shadow-sm hover:scale-105 hover:shadow-md transition"
              >
                <svg className="h-3 w-3 stroke-ink" fill="none" viewBox="0 0 24 24" strokeWidth="2.5" stroke="currentColor">
                  <path strokeLinecap="round" strokeLinejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5" />
                </svg>
              </button>
            </div>
          )}

          {/* Categories Slider */}
          <div
            ref={scrollRef}
            className="flex w-full items-center gap-8 overflow-x-auto no-scrollbar scroll-smooth py-2"
          >
            {categories.map((cat) => {
              const isSelected = selectedCategory === cat.name;
              return (
                <button
                  key={cat.id}
                  onClick={() => onSelectCategory(cat.name)}
                  className={`group flex flex-col items-center gap-2 whitespace-nowrap transition relative pb-2 pt-1 min-w-[56px] focus:outline-none ${
                    badgeStyle === 'pill'
                      ? isSelected
                        ? 'bg-ink text-canvas px-4 py-2 rounded-full font-semibold'
                        : 'bg-surface-soft hover:bg-surface-strong text-secondary hover:text-ink px-4 py-2 rounded-full font-medium'
                      : isSelected
                      ? 'text-ink font-semibold'
                      : 'text-secondary hover:text-ink hover:opacity-100 font-medium'
                  }`}
                >
                  <span className="text-2xl transition group-hover:scale-110">{cat.icon}</span>
                  <span className="text-xs tracking-tight">{cat.name}</span>
                  {badgeStyle === 'underline' && isSelected && (
                    <div className="absolute bottom-0 left-0 right-0 h-[2px] bg-ink rounded-full" />
                  )}
                </button>
              );
            })}
          </div>

          {/* Right Arrow & Filter Button */}

            {canScrollRight && (
              <div className="relative flex items-center mr-3">
                <div className="gradient-mask-right absolute -right-4 top-0 bottom-0 w-16 pointer-events-none" />

    // Mock Listing Grid

    // VARIANT A: Canonical Inline Header Expansion (Airbnb Web Standard)
    function VariantA({ state, setState }) {
      const [isExpanded, setIsExpanded] = useState(false);
      const [activeTab, setActiveTab] = useState('stays');
      const [activeSegment, setActiveSegment] = useState('where'); // 'where', 'checkIn', 'checkOut', 'who'
      const headerRef = useRef(null);

      // Click outside to collapse
      useEffect(() => {
        const handleClickOutside = (e) => {
          if (headerRef.current && !headerRef.current.contains(e.target)) {
            setIsExpanded(false);
          }
        };
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const totalGuests = state.guests.adults + state.guests.children + state.guests.infants + state.guests.pets;

      return (
        <header ref={headerRef} className="sticky top-0 z-40 bg-canvas transition-all duration-300">
          {/* Top Navbar */}
          <div className={`px-6 md:px-12 border-b border-hairline-soft transition-all duration-300 ${isExpanded ? 'pb-4 pt-4' : 'h-20 flex items-center'}`}>
            <div className="flex items-center justify-between w-full">
              {/* Brand Logo */}
              <div className="flex items-center gap-2 cursor-pointer" onClick={() => setIsExpanded(false)}>
                <svg className="h-8 w-8 fill-rausch" viewBox="0 0 32 32">
                  <path d="M16 1c2.008 0 3.463.963 4.751 3.269l.533 1.025c1.954 3.83 6.116 12.553 7.1 14.865 1.458 3.447.886 6.837-1.468 9.215-2.227 2.251-5.419 3.126-8.916 2.626-3.497.5-6.689-.375-8.916-2.626-2.354-2.378-2.926-5.768-1.468-9.215.984-2.312 5.146-11.035 7.1-14.865l.533-1.025C12.537 1.963 13.992 1 16 1zm0 2c-1.396 0-2.375.642-3.454 2.569l-.53 1.021C10.088 10.428 5.955 19.1 5.01 21.328c-1.127 2.665-.67 5.182 1.085 6.953 1.761 1.777 4.382 2.476 7.395 2.012 1.034-.16 2.008-.432 2.51-.776.502.344 1.476.616 2.51.776 3.013.464 5.634-.235 7.395-2.012 1.755-1.771 2.212-4.288 1.085-6.953-.945-2.228-5.078-10.9-7.006-14.738l-.53-1.021C18.375 3.642 17.396 3 16 3zm0 15c2.209 0 4 1.791 4 4 0 1.408-.727 2.646-1.826 3.364C17.484 25.819 16.77 26 16 26s-1.484-.181-2.174-.636C12.727 24.646 12 23.408 12 22c0-2.209 1.791-4 4-4z" />
                </svg>
                <span className="text-xl font-bold tracking-tight text-rausch">motel</span>
              </div>

              {/* Middle Section: Compact Pill vs Stays/Experiences Tab Switcher */}
              {!isExpanded ? (
                <div
                  onClick={() => setIsExpanded(true)}
                  className="flex items-center divide-x divide-hairline rounded-full border border-hairline py-2 pl-6 pr-2 shadow-airbnb-rest hover:shadow-airbnb-hover transition-all cursor-pointer select-none"
                >
                  <button className="text-sm font-semibold text-ink pr-4 focus:outline-none">
                    {state.destination || 'Anywhere'}
                  </button>
                  <button className="text-sm font-semibold text-ink px-4 focus:outline-none">
                    {state.checkIn ? `${state.checkIn} – ${state.checkOut || 'Dates'}` : 'Any week'}
                  </button>
                  <div className="flex items-center gap-3 pl-4">
                    <span className="text-sm text-secondary font-medium">
                      {totalGuests > 0 ? `${totalGuests} guests` : 'Add guests'}
                    </span>
                    <div className="flex h-8 w-8 items-center justify-center rounded-full bg-rausch text-canvas">
                      <svg className="h-3.5 w-3.5 stroke-canvas" fill="none" viewBox="0 0 24 24" strokeWidth="3">
                        <path strokeLinecap="round" strokeLinejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                      </svg>
                    </div>
                  </div>
                </div>
              ) : (
                <div className="flex items-center gap-6">
                  <button
                    onClick={() => setActiveTab('stays')}
                    className={`text-base pb-1 transition relative ${activeTab === 'stays' ? 'text-ink font-semibold' : 'text-secondary hover:text-ink'}`}
                  >
                    Stays
                    {activeTab === 'stays' && <div className="absolute bottom-0 left-0 right-0 h-0.5 bg-ink" />}
                  </button>
                  <button
                    onClick={() => setActiveTab('experiences')}
                    className={`text-base pb-1 transition relative ${activeTab === 'experiences' ? 'text-ink font-semibold' : 'text-secondary hover:text-ink'}`}
                  >
                    Experiences
                    {activeTab === 'experiences' && <div className="absolute bottom-0 left-0 right-0 h-0.5 bg-ink" />}
                  </button>
                </div>
              )}

              {/* Right Side: Host CTA & Profile */}
              <div className="flex items-center gap-2">
                <button className="hidden md:block rounded-full px-4 py-2.5 text-sm font-semibold hover:bg-surface-soft transition">
                  Become a host
                </button>
                <button className="rounded-full p-2.5 hover:bg-surface-soft transition">
                  <svg className="h-4 w-4" fill="none" viewBox="0 0 24 24" strokeWidth="1.8" stroke="currentColor">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 21a9 9 0 100-18 9 9 0 000 18zM3.6 9h16.8M3.6 15h16.8" />
                  </svg>
                </button>
                <div className="flex items-center gap-3 rounded-full border border-hairline p-1.5 pl-3.5 shadow-sm hover:shadow-md transition cursor-pointer">
                  <svg className="h-4 w-4 stroke-ink" fill="none" viewBox="0 0 24 24" strokeWidth="2.5">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
                  </svg>
                  <div className="h-7 w-7 rounded-full bg-secondary/30 flex items-center justify-center text-xs font-bold text-white">
                    P
                  </div>
                </div>
              </div>
            </div>

            {/* Expanded 4-Segment Search Bar */}
            {isExpanded && (
              <div className="mt-4 flex justify-center">
                <div className="relative flex w-full max-w-4xl items-center rounded-full border border-hairline bg-surface-soft shadow-airbnb-hover">
                  {/* Where Segment */}
                  <div
                    onClick={() => setActiveSegment('where')}
                    className={`flex-1 cursor-pointer rounded-full px-8 py-3 transition ${
                      activeSegment === 'where' ? 'bg-canvas shadow-airbnb-expanded' : 'hover:bg-neutral-200/50'
                    }`}
                  >
                    <div className="text-xs font-bold text-ink">Where</div>
                    <input
                      type="text"
                      placeholder="Search destinations"
                      value={state.destination}
                      onChange={(e) => setState((prev) => ({ ...prev, destination: e.target.value }))}
                      className="w-full bg-transparent text-sm text-ink placeholder-secondary font-medium focus:outline-none"
                    />
                  </div>

                  {/* Divider */}
                  <div className="h-8 w-px bg-hairline" />

                  {/* Check In */}
                  <div
                    onClick={() => setActiveSegment('checkIn')}
                    className={`flex-1 cursor-pointer rounded-full px-6 py-3 transition ${
                      activeSegment === 'checkIn' ? 'bg-canvas shadow-airbnb-expanded' : 'hover:bg-neutral-200/50'
                    }`}
                  >
                    <div className="text-xs font-bold text-ink">Check in</div>
                    <div className="text-sm text-secondary font-medium">
                      {state.checkIn || 'Add dates'}
                    </div>
                  </div>

                  {/* Divider */}
                  <div className="h-8 w-px bg-hairline" />

                  {/* Check Out */}
                  <div
                    onClick={() => setActiveSegment('checkOut')}
                    className={`flex-1 cursor-pointer rounded-full px-6 py-3 transition ${
                      activeSegment === 'checkOut' ? 'bg-canvas shadow-airbnb-expanded' : 'hover:bg-neutral-200/50'
                    }`}
                  >
                    <div className="text-xs font-bold text-ink">Check out</div>
                    <div className="text-sm text-secondary font-medium">
                      {state.checkOut || 'Add dates'}
                    </div>
                  </div>

            badgeStyle="underline"
          />

          {/* Floating Map Toggle Pill at Bottom Center */}
          <div className="fixed bottom-20 left-1/2 -translate-x-1/2 z-30">
            <button className="flex items-center gap-2 rounded-full bg-ink px-5 py-3 text-xs font-bold text-canvas shadow-airbnb-dialog hover:scale-105 transition">
              <span>Show map</span>
              <svg className="h-4 w-4" fill="none" viewBox="0 0 24 24" strokeWidth="2" stroke="currentColor">
                <path strokeLinecap="round" strokeLinejoin="round" d="M9 6.75V15m6-6v8.25m.503 3.498l4.875-2.437c.381-.19.622-.58.622-1.006V4.82c0-.836-.88-1.38-1.628-1.006l-3.869 1.934a1.12 1.12 0 01-1.006 0L9.503 3.38a1.12 1.12 0 00-1.006 0L3.622 5.817A1.125 1.125 0 003 6.824v12.355c0 .836.88 1.38 1.628 1.006l3.869-1.934a1.12 1.12 0 011.006 0l4.994 2.497a1.12 1.12 0 001.006 0z" />
              </svg>
            </button>
          </div>
        </div>
      );
    }

    // FLOATING PROTOTYPE SWITCHER (as specified in UI.md)
    function PrototypeSwitcher({ variants, current, onChange }) {
      const currentIndex = variants.findIndex((v) => v.key === current);

      const cycle = (direction) => {
        const nextIndex = (currentIndex + direction + variants.length) % variants.length;
        onChange(variants[nextIndex].key);
      };

      useEffect(() => {
        const handleKeyDown = (e) => {
          const activeTag = document.activeElement ? document.activeElement.tagName.toLowerCase() : '';
          if (['input', 'textarea'].includes(activeTag) || document.activeElement.isContentEditable) {
            return;
          }
          if (e.key === 'ArrowLeft') cycle(-1);
          if (e.key === 'ArrowRight') cycle(1);
        };
        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [currentIndex]);

      const currentVariant = variants[currentIndex] || variants[0];

      return (
        <aside
          aria-label="Prototype Variant Switcher"
          className="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex items-center gap-2 rounded-full bg-ink/90 backdrop-blur-md px-3 py-2 text-canvas shadow-2xl border border-white/20 select-none text-xs"
        >
          {/* Left Arrow */}
          <button
            onClick={() => cycle(-1)}
            aria-label="Previous Variant"
            className="flex h-7 w-7 items-center justify-center rounded-full hover:bg-white/20 transition active:scale-95"
          >
            ←
          </button>

          {/* Variant Label */}
          <div className="px-2 font-mono font-medium flex items-center gap-2">
            <span className="font-bold text-rausch">Variant {currentVariant.key}:</span>
            <span className="text-white/90">{currentVariant.name}</span>
          </div>

          {/* Right Arrow */}
          <button
            onClick={() => cycle(1)}
            aria-label="Next Variant"
            className="flex h-7 w-7 items-center justify-center rounded-full hover:bg-white/20 transition active:scale-95"
          >
            →
          </button>
        </aside>
      );
    }

    // LIVE STATE INSPECTOR PANEL
    function StateInspector({ state, variant }) {
      const [isOpen, setIsOpen] = useState(false);

      return (
        <div className="fixed bottom-4 right-4 z-50">
          {!isOpen ? (
            <button
              onClick={() => setIsOpen(true)}
              className="rounded-full bg-neutral-900 text-canvas px-3.5 py-1.5 text-xs font-mono font-semibold shadow-lg hover:bg-neutral-800 transition border border-neutral-700"
            >
              {`{ } State`}
            </button>
          ) : (
            <div className="w-80 rounded-2xl bg-neutral-900 text-canvas p-4 shadow-2xl border border-neutral-700 text-xs font-mono">
              <div className="flex items-center justify-between pb-2 border-b border-neutral-800 mb-2">
                <span className="font-bold text-rausch">Live Filter State</span>
                <button
                  onClick={() => setIsOpen(false)}
                  className="text-neutral-400 hover:text-white"
                >
                  ✕
                </button>
              </div>
              <pre className="text-[11px] text-emerald-400 overflow-x-auto">
                {JSON.stringify({ variant, ...state }, null, 2)}
              </pre>
            </div>
          )}
        </div>
      );
    }

    // MAIN ROOT PROTOTYPE APPLICATION
    function App() {
      const VARIANTS = [
        { key: 'A', name: 'Canonical Inline Header Expansion' },
        { key: 'B', name: 'Overlay Dialog Modal Flow' },
        { key: 'C', name: 'Detached Dock & Segment Popovers' },
      ];

      const getInitialVariant = () => {
        const params = new URLSearchParams(window.location.search);
        const v = params.get('variant');
        return ['A', 'B', 'C'].includes(v) ? v : 'A';
      };

      const [currentVariant, setCurrentVariant] = useState(getInitialVariant);

      const [searchState, setSearchState] = useState({
        destination: '',
        checkIn: '',
        checkOut: '',
        guests: { adults: 1, children: 0, infants: 0, pets: 0 },
        category: 'Beachfront',
      });

      const [favorites, setFavorites] = useState(['1', '4']);

      const handleToggleFavorite = (id) => {
        setFavorites((prev) =>
          prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]
        );
      };

      const handleVariantChange = (key) => {
        setCurrentVariant(key);
        const url = new URL(window.location);
        url.searchParams.set('variant', key);
        window.history.pushState({}, '', url);
      };

      useEffect(() => {
        const handlePopState = () => {
          setCurrentVariant(getInitialVariant());
        };
        window.addEventListener('popstate', handlePopState);
        return () => window.removeEventListener('popstate', handlePopState);
      }, []);

      return (
        <div className="min-h-screen bg-canvas pb-24">
          {/* Mount Variant */}
          {currentVariant === 'A' && (
            <VariantA state={searchState} setState={setSearchState} />
          )}
          {currentVariant === 'B' && (
            <VariantB state={searchState} setState={setSearchState} />
          )}
          {currentVariant === 'C' && (
            <VariantC state={searchState} setState={setSearchState} />
          )}

          {/* Real density content */}
          <ListingGrid
            listings={MOCK_LISTINGS}
            onToggleFavorite={handleToggleFavorite}
            favorites={favorites}
          />

          {/* Floating Switcher */}
          <PrototypeSwitcher
            variants={VARIANTS}
            current={currentVariant}
            onChange={handleVariantChange}
          />

          {/* State Inspector */}
          <StateInspector state={searchState} variant={currentVariant} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
